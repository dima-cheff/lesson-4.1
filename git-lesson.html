<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Git и GitHub: пошаговая история проекта (v5)</title>
<style>
:root{--loc:#2563eb;--locb:#dbeafe;--stg:#ea580c;--stgb:#ffedd5;--com:#16a34a;--comb:#dcfce7;--gh:#7c3aed;--ghb:#ede9fe;--ink:#0f172a;--mut:#64748b;--bg:#eef2f7}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.app{max-width:1080px;margin:0 auto;padding:12px;min-height:100vh;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mut)}
.bar{flex:1;height:7px;background:#dbe3ee;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--loc),var(--stg),var(--com),var(--gh));transition:width .45s}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:#475569}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 4px 20px rgba(15,23,42,.08);flex:1;display:flex;flex-direction:column;gap:14px}
h2{margin:0;font-size:clamp(23px,4.4vw,34px);letter-spacing:-.01em}
.main{margin:0;font-size:clamp(15px,2.4vw,19px);font-weight:600;color:#1e3a8a;border-left:5px solid var(--loc);padding:4px 0 4px 12px;background:linear-gradient(90deg,#eff6ff,transparent)}
.vis{background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;padding:16px;min-height:210px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;overflow-x:auto}
.term{background:#0f172a;color:#e2e8f0;border-radius:12px;padding:12px 14px;font:14px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.term .p{color:#4ade80}.term .o{color:#94a3b8}
.say{font-size:clamp(15px,2.3vw,18px);line-height:1.55}
.say code,.gloss code,.cmp code,.ops b,.cs code{font-family:ui-monospace,Menlo,Consolas,monospace;background:#eef2ff;color:#3730a3;padding:1px 6px;border-radius:6px;font-size:.92em}
.ex{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:10px 14px;font-size:14.5px;line-height:1.5}
.nav{display:flex;gap:10px;align-items:center;justify-content:space-between;position:sticky;bottom:8px;background:rgba(238,242,247,.92);backdrop-filter:blur(6px);padding:8px;border-radius:16px}
.nav span{font-size:13px;color:var(--mut);text-align:center}
button{font:600 16px system-ui;border:2px solid #cbd5e1;background:#fff;color:var(--ink);padding:11px 20px;border-radius:12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--loc)}
button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--loc);border-color:var(--loc);color:#fff}
.hid{display:none!important}
.pop{animation:pop .5s ease both}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.95)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(22,163,74,.0)}50%{box-shadow:0 0 0 10px rgba(22,163,74,.25)}}
/* files */
.f{display:inline-flex;gap:6px;align-items:center;padding:7px 11px;border-radius:10px;border:2px solid;font:600 14px ui-monospace,Menlo,monospace;background:#fff;white-space:nowrap}
.f.loc{border-color:var(--loc);color:#1e40af;background:var(--locb)}
.f.stg{border-color:var(--stg);color:#9a3412;background:var(--stgb)}
.f.com{border-color:var(--com);color:#166534;background:var(--comb)}
.f.gray{border-color:#94a3b8;color:#475569;background:#f1f5f9}
.f.mod{box-shadow:0 0 0 4px rgba(245,158,11,.4)}
.tag{background:#fef3c7;color:#92400e;border-radius:8px;padding:3px 9px;font:600 13px ui-monospace,monospace}
.mut{color:var(--mut);font-size:13px}
/* zones */
.zone{flex:1 1 220px;border:2px solid;border-radius:16px;padding:10px 12px;min-height:130px;display:flex;flex-direction:column;gap:8px;background:#fff}
.zone h4{margin:0;font-size:15px}
.zone h4 small{display:block;color:var(--mut);font-weight:500;font-size:12px;margin-top:1px}
.zone.loc{border-color:var(--loc);background:var(--locb)}
.zone.stg{border-color:var(--stg);background:var(--stgb)}
.zone.com{border-color:var(--com);background:var(--comb)}
.zone.gh{border-color:var(--gh);background:var(--ghb)}
.zb{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
.ar{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:700;color:#475569;text-align:center}
.ar b{font-size:30px;line-height:1}
@media(max-width:720px){.ar{flex:1 1 100%;flex-direction:row;gap:8px;justify-content:center}.ar b{transform:rotate(90deg)}}
/* commits */
.chain{display:flex;flex-wrap:wrap;align-items:flex-start}
.pair{display:flex;align-items:flex-start}
.ln{width:34px;height:4px;background:var(--com);margin-top:17px;border-radius:2px;flex:none}
.ln.gh{background:var(--gh)}
.node{display:flex;flex-direction:column;align-items:center;width:110px;text-align:center;gap:3px;flex:none}
.dot{width:38px;height:38px;border-radius:50%;background:var(--com);color:#fff;display:grid;place-items:center;font-weight:700}
.dot.sm{width:28px;height:28px;font-size:14px;flex:none}
.node code{font-size:12px;color:var(--com);font-weight:700}
.node small{font-size:12px;color:#334155;line-height:1.2}
.node.gh .dot{background:var(--gh)}.node.gh code{color:var(--gh)}
.node.new .dot{animation:glow 1.6s ease 2}
.zone .node{width:80px}.zone .ln{width:14px}
.pill{display:inline-block;font:700 11px ui-monospace,monospace;padding:2px 7px;border-radius:99px;margin-top:2px}
.pill.m{background:var(--com);color:#fff}.pill.b{background:var(--stg);color:#fff}.pill.h{background:#0f172a;color:#fff}
.vln{width:4px;height:22px;background:var(--com);margin:0 0 0 51px;border-radius:2px}
/* misc blocks */
.bubble{flex:1 1 220px;background:#fee2e2;border:2px solid #fca5a5;color:#991b1b;border-radius:16px;padding:12px 14px;font-weight:600}
.dash{border-style:dashed!important}
.ghost{opacity:.85}
.ghost .dot{background:#fff;color:#94a3b8;border:3px dashed #94a3b8}
.ghost small{color:#64748b}
.warn{flex:1 1 100%;background:#fff7ed;border:2px solid #fdba74;border-radius:12px;padding:9px 13px;font-size:14px}
.warn.ok{background:#f0fdf4;border-color:#86efac}
.badge{flex:1 1 100%;text-align:center;font-weight:700;padding:8px 12px;border-radius:12px;background:var(--locb);color:#1e40af}
.badge.o{background:var(--stgb);color:#9a3412}.badge.g{background:var(--comb);color:#166534}.badge.p{background:var(--ghb);color:#5b21b6}
.cmp{display:flex;flex-wrap:wrap;gap:10px;flex:1 1 100%}
.cmp>div{flex:1 1 240px;background:#fff;border:1px solid #cbd5e1;border-radius:12px;padding:10px 12px;font-size:14px}
.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;width:100%}
.gloss>div{background:#fff;border:1px solid #ddd6fe;border-radius:10px;padding:8px 10px;font-size:14px}
.ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;width:100%}
.op{border:2px solid;border-radius:12px;padding:9px 12px;font-size:14px;background:#fff}
.op b{display:block;font-size:16px;margin-bottom:2px;width:max-content}
.op em{display:block;font-style:normal;margin-top:4px;font-weight:700}
.op.loc{border-color:var(--loc)}.op.gh{border-color:var(--gh)}
.bl{font-size:14.5px;line-height:1.7}
/* timeline */
.vl{border-left:4px solid var(--com);margin-left:14px;padding-left:18px;display:flex;flex-direction:column;gap:14px}
.vr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative}
.vr .dot{margin-left:-34px;outline:4px solid #f8fafc}
.vr code{font-weight:700;color:var(--com)}
.vr em{font-style:normal;background:#0f172a;color:#fff;border-radius:99px;font:700 11px ui-monospace,monospace;padding:2px 8px}
/* cheat sheet */
.cs{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px;width:100%}
.cs>div{border:2px solid;border-radius:14px;padding:10px 12px;background:#fff}
.cs h4{margin:0 0 6px;font-size:15px}
.cs p{margin:5px 0;font-size:13.5px;line-height:1.4}
.cs .loc{border-color:var(--loc)}.cs .stg{border-color:var(--stg)}.cs .com{border-color:var(--com)}.cs .gh{border-color:var(--gh)}
/* quiz */
.qz{width:100%;max-width:720px}
.qz h3{margin:6px 0 12px;font-size:20px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;font-weight:500;font-size:16px}
.opt.ok{background:#dcfce7;border-color:var(--com)}.opt.no{background:#fee2e2;border-color:#dc2626}
.fb{margin-top:10px;font-size:15px;line-height:1.5}
.res{text-align:center;font-size:24px;font-weight:700;line-height:2}
.sc{flex:0 1 240px;min-width:210px;background:#1e1e1e;color:#ccc;border-radius:10px;padding:8px 0 10px;font:13px system-ui}
.sch{font-size:10.5px;letter-spacing:.06em;padding:0 12px 6px;color:#aaa}
.sct{background:#2a2d2e;padding:3px 12px;font-weight:700;font-size:11px;text-transform:uppercase;color:#ddd;display:flex;justify-content:space-between;margin-top:4px}
.sct i{font-style:normal;background:#4d4d4d;border-radius:99px;padding:0 7px}
.sr{display:flex;justify-content:space-between;padding:3px 12px}
.sr b.u,.sr b.a{color:#73c991}.sr b.m{color:#e2c08d}
.mut2{color:#888;font-style:italic}
.bd{margin-left:5px;font-size:11px;background:var(--loc);color:#fff;border-radius:6px;padding:0 6px}
.bd.o{background:var(--stg)}.bd.ck{background:transparent;color:var(--com)}.bd.sm{background:transparent;color:#9a3412;font-weight:500;padding:0}
.f.dim{opacity:.55}
.chg{animation:pulse 1.2s ease 2}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}50%{box-shadow:0 0 0 8px rgba(37,99,235,.3)}}
.ar.on{color:var(--stg)}.ar.on.c{color:var(--com)}
.code{font:13px/1.55 ui-monospace,Menlo,monospace;background:#0f172a;color:#e2e8f0;border-radius:10px;padding:8px 0;flex:1 1 100%;overflow-x:auto}
.code .cl{display:block;white-space:pre;padding:0 12px}
.code .del{color:#fca5a5;background:rgba(220,38,38,.2)}.code .add{color:#86efac;background:rgba(22,163,74,.22)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:1 1 100%;justify-content:center;font-size:14px}
.flow span{background:#fff;border:2px solid #cbd5e1;border-radius:99px;padding:5px 12px;font-weight:600}
.code .lbl{color:#94a3b8;font:12px system-ui;padding-bottom:3px}
.two{display:flex;gap:10px;flex:1 1 100%;flex-wrap:wrap}.two .code{flex:1 1 240px}
.op b{max-width:100%;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="app">
  <div class="top"><b id="cnt"></b><div class="bar"><i id="pb"></i></div></div>
  <div class="legend">
    <span><i style="background:var(--loc)"></i>синий — локальная работа</span>
    <span><i style="background:var(--stg)"></i>оранжевый — подготовлено (staging)</span>
    <span><i style="background:var(--com)"></i>зелёный — коммиты</span>
    <span><i style="background:var(--gh)"></i>фиолетовый — GitHub</span>
  </div>
  <div class="card" id="slide"></div>
  <div class="nav"><button id="back">← Назад</button><span id="stp"></span><button id="next" class="pri">Далее →</button></div>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const d=(a,b=a)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return `data-s="${r.join(',')}"`};
const up=a=>d(a,9);
const U='&lt;URL-репозитория&gt;';

/* ---------- строительные блоки ---------- */
const F=(n,c='loc',x='')=>`<span class="f ${c} ${x}">📄 ${n}${x.includes('mod')?' ✎':''}</span>`;
const N=(id,m,x='')=>`<div class="node ${x}"><div class="dot">✓</div><code>${id}</code><small>${m}</small></div>`;
const CH=(arr,gh)=>`<div class="chain">${arr.map((c,i)=>`<div class="pair" ${c[2]||''}>${i?`<div class="ln ${gh?'gh':''}"></div>`:''}${N(c[0],c[1],(gh?'gh ':'')+(c[3]||''))}</div>`).join('')}</div>`;
const Z=(cls,title,sub,body,st='',a='')=>`<div class="zone ${cls}" style="${st}" ${a}><h4>${title}<small>${sub}</small></h4><div class="zb">${body}</div></div>`;
const AR=(t,a='')=>`<div class="ar" ${a}><span>${t}</span><b>➜</b></div>`;

/* ---------- настройки истории: меняй здесь, чтобы совпадало с твоим кодом ---------- */
const CFG={
  c1:['a1b2c3f','Добавил страницу и стили'],
  c2:['d4e5f6a','Изменил цвет кнопки'],
  c3:['f9a8b7c','Новая кнопка'],           // коммит в ветке feature/button
  html:['<!DOCTYPE html>','<html lang="ru">','<head>','  <meta charset="UTF-8">','  <title>Моя визитка</title>','  <link rel="stylesheet" href="style.css">','</head>','<body>','  <h1>Привет! Это моя визитка</h1>','  <button class="btn">Написать мне</button>','</body>','</html>'],
  css:['body {','  font-family: sans-serif;','}','.btn {','  background: blue;','}'],
  cssLine:4, cssNew:'  background: green;',   // какая строка style.css меняется (счёт с 0) и на что
  branch:'feature/button'
};
const C1=CFG.c1,C2=CFG.c2,C3=CFG.c3;

/* ---------- доска: три зоны + панель как в VS Code ---------- */
const W=(a,b)=>({'index.html':a,'style.css':b});
const ST={
  init:{w:W('U','U'),s:{},c:[]},
  add1:{w:W('S','U'),s:{'index.html':'A'},c:[]},
  add2:{w:W('S','S'),s:{'index.html':'A','style.css':'A'},c:[]},
  com1:{w:W('C','C'),s:{},c:[C1]},
  mod:{w:W('C','M'),s:{},c:[C1]},
  add3:{w:W('C','S'),s:{'style.css':'M'},c:[C1]},
  com2:{w:W('C','C'),s:{},c:[C1,C2]}
};
function scp(st){
  const un=Object.entries(st.w).filter(([n,k])=>k=='U'||k=='M'),sg=Object.entries(st.s);
  const row=(n,k,c)=>`<div class="sr"><span>${n}</span><b class="${c}">${k}</b></div>`;
  return `<div class="sc"><div class="sch">SOURCE CONTROL · как в VS Code</div>`+
    (sg.length?`<div class="sct">Staged Changes <i>${sg.length}</i></div>${sg.map(([n,k])=>row(n,k,'a')).join('')}`:'')+
    `<div class="sct">Changes <i>${un.length}</i></div>`+
    (un.length?un.map(([n,k])=>row(n,k,k=='U'?'u':'m')).join(''):'<div class="sr mut2">нет изменений</div>')+`</div>`;
}
function board(st,o={}){
  const chg=n=>o.chg&&o.chg.includes(n)?'chg':'';
  const wf=Object.entries(st.w).map(([n,k])=>{
    const ch=k=='U'||k=='M';
    return `<span class="f ${ch?'loc':k=='S'?'loc dim':'gray'} ${chg(n)}">📄 ${n}${ch?`<b class="bd">${k}</b>`:k=='S'?'<b class="bd sm">→ staging</b>':'<b class="bd ck">✓</b>'}</span>`}).join('');
  const sf=Object.entries(st.s).map(([n,k])=>`<span class="f stg ${chg(n)}">📄 ${n}<b class="bd o">${k}</b></span>`).join('')||'<span class="mut">пусто</span>';
  const cm=st.c.length?CH(st.c.map((x,i)=>[x[0],x[1],'',(o.newc&&i==st.c.length-1)?'new':''])):'<span class="mut">коммитов пока нет<br>(No commits yet)</span>';
  return Z('loc','🖥 Working directory','рабочая папка · в VS Code: Changes',wf,'flex:1 1 200px')+
    `<div class="ar ${o.ar=='add'?'on':''}"><span>git add</span><b>➜</b></div>`+
    Z('stg','📦 Staging area','подготовлено · Staged Changes',sf,'flex:1 1 200px')+
    `<div class="ar c ${o.ar=='commit'?'on':''}"><span>git commit</span><b>➜</b></div>`+
    Z('com','🗄 Repository','локальная история',cm,'flex:1 1 200px')+
    scp(st)+(o.extra||'');
}
const GHNOTE=Z('gh','☁️ GitHub','пока без изменений','<span class="mut">Коммиты только на твоём компьютере: на GitHub ничего не отправлялось.</span>','flex:1 1 100%;border-style:dashed;min-height:auto');
const CSSB=CFG.css,CL=CFG.cssLine,CSSA=CSSB.map((l,i)=>i==CL?CFG.cssNew:l);
const CODE=(lbl,lines)=>`<div class="code"><span class="cl lbl">${lbl}</span>${lines.map(l=>`<span class="cl ${l[1]||''}">${esc(l[0])}</span>`).join('')}</div>`;
const h0=Math.max(0,CL-3),h1=Math.min(CSSB.length-1,CL+3);
const HUNK=`@@ -${h0+1},${h1-h0+1} +${h0+1},${h1-h0+1} @@`;
const DIFF=`<div class="code"><span class="cl">${esc('diff --git a/style.css b/style.css')}</span><span class="cl">${HUNK}</span>`+CSSB.slice(h0,h1+1).map((l,j)=>h0+j==CL?`<span class="cl del">-${esc(l)}</span><span class="cl add">+${esc(CFG.cssNew)}</span>`:`<span class="cl"> ${esc(l)}</span>`).join('')+`</div>`;
const BEFORE=CODE('style.css — как сохранён в первом коммите',CSSB.map(l=>[l]));
const AFTER=CODE('style.css — после твоей правки',CSSA.map((l,i)=>[l,i==CL?'add':'']));
const SNIP='<div class="two">'+BEFORE+AFTER+'</div>';
const INIT='<div class="two">'+CODE('index.html',CFG.html.map(l=>[l]))+CODE('style.css',CSSB.map(l=>[l]))+'</div>';

/* ---------- слайды ---------- */
const S=[

/* 1 */
{t:'1. Проблема: проект без Git',m:'Файлов много, а какая версия настоящая — непонятно.',n:2,
 v:Z('loc','📁 my-site','папка проекта без Git',[F('index.html','gray'),F('index-final.html','gray'),F('index-final-2.html','gray'),F('style.css','gray'),F('style-new.css','gray'),F('style-final-real.css','gray')].join(''),'flex:2 1 320px')+
   `<div class="bubble" ${d(1)}>❓ Что менялось? Какая версия рабочая? Как вернуться к состоянию «позавчера»?</div>`,
 c:[null,null],
 s:['Так выглядит папка, когда версии сохраняют копированием файлов. «final», «final-2», «final-real» быстро превращаются в путаницу.','Заказчик просит вернуть сайт как был позавчера. Какой из файлов нужный? Для таких случаев и придумали Git.'],
 e:'Наш проект — сайт из двух файлов: <b>index.html</b> и <b>style.css</b>. Дальше создаём его историю с нуля.'},

/* 2 */
{t:'2. Зачем нужен Git',m:'Git хранит историю проекта, показывает изменения и позволяет вернуться назад.',n:4,
 v:`<div class="chain" style="flex:1 1 100%;justify-content:center">
   <div class="pair" ${up(0)}>${N('•','Версия 1')}</div>
   <div class="pair" ${up(0)}><div class="ln"></div>${N('•','Версия 2')}</div>
   <div class="pair" ${up(0)}><div class="ln"></div>${N('•','Версия 3')}</div>
   <div class="pair" ${d(3)}><div class="ln" style="background:#94a3b8"></div><div class="node ghost"><div class="dot">✎</div><small>правки без коммита</small></div></div></div>
   <div class="cmp">
    <div ${up(0)}>📜 <b>История.</b> Git хранит контрольные точки проекта — коммиты.</div>
    <div ${up(1)}>🔍 <b>Что менялось.</b> Видно, какие файлы и строки изменились.</div>
    <div ${up(2)}>⏪ <b>Возврат.</b> Сломал сайт — можно вернуться к рабочей версии.</div>
    <div ${d(3)}>⚠️ <b>Не автосохранение.</b> Точку создаёшь сам командой commit.</div></div>`,
 c:[null,null,null,null],

let I=0,K=0;
const root=$('#slide');

function cmdHTML(s){
  const fmt=x=>x.c.split('\n').map(l=>`<span class="p">$ </span>${esc(l)}`).join('\n')+(x.o?`\n<span class="o">${esc(x.o)}</span>`:'');
  if(s.acc){
    const lines=s.c.map((x,i)=>x?`<span ${up(i)}>${fmt(x)}\n</span>`:'').join('');
    return `<div class="term" ${up(0)}>${lines}</div>`;
  }
  return s.c.map((x,i)=>x?`<div class="term" ${d(i)}>${fmt(x)}</div>`:'').join('');
}
function draw(){
  const s=S[I];
  root.innerHTML=`<h2>${s.t}</h2><p class="main">${s.m}</p><div class="vis">${s.r?s.r(K):s.v}</div>${cmdHTML(s)}${s.s.map((x,i)=>x?`<div class="say" ${d(i)}>${x}</div>`:'').join('')}<div class="ex">📌 <b>В нашем проекте:</b> ${s.e}</div>`;
  root.querySelectorAll('[data-s]').forEach(e=>e.classList.add('hid'));
  if(s.quiz)quiz(root.querySelector('.vis'));
  apply();
}
function apply(){
  const s=S[I];
  if(s.r)root.querySelector('.vis').innerHTML=s.r(K);
  root.querySelectorAll('[data-s]').forEach(e=>{
    const on=e.dataset.s.split(',').includes(String(K));
    if(on&&e.classList.contains('hid')){e.classList.remove('hid','pop');void e.offsetWidth;e.classList.add('pop')}
    else if(!on)e.classList.add('hid');
  });
  $('#cnt').textContent=`Экран ${I+1} / ${S.length}`;
  $('#pb').style.width=((I+(K+1)/s.n)/S.length*100)+'%';
  $('#stp').textContent=s.n>1?`Шаг ${K+1} из ${s.n}`:'';
  $('#back').disabled=I===0&&K===0;
  const last=I===S.length-1&&K===s.n-1;
  $('#next').disabled=last;
  $('#next').textContent=last?'Конец':'Далее →';
}
function next(){const s=S[I];if(K<s.n-1)K++;else if(I<S.length-1){I++;K=0;draw();window.scrollTo({top:0,behavior:'smooth'});return}apply()}
function back(){if(K>0)K--;else if(I>0){I--;K=S[I].n-1;draw();window.scrollTo({top:0,behavior:'smooth'});return}apply()}
$('#next').onclick=next;$('#back').onclick=back;
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}if(e.key==='ArrowLeft')back()});

/* ---------- квиз ---------- */
function quiz(box){
  let q=0,sc=0;
  const show=()=>{
    if(q>=Q.length){
      box.innerHTML=`<div class="res">🎉 Правильных ответов: ${sc} из ${Q.length}<br><button class="pri" id="rs">Пройти ещё раз</button></div>`;
      $('#rs').onclick=()=>{q=0;sc=0;show()};return;
    }
    const x=Q[q];
    box.innerHTML=`<div class="qz"><div class="mut">Вопрос ${q+1} из ${Q.length}</div><h3>${esc(x.q)}</h3>${x.o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}<div class="fb"></div></div>`;
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i;
      box.querySelectorAll('.opt').forEach(o=>o.disabled=true);
      box.querySelectorAll('.opt')[x.a].classList.add('ok');
      if(i===x.a)sc++;else b.classList.add('no');
      box.querySelector('.fb').innerHTML=`<b>${i===x.a?'✅ Верно!':'❌ Не совсем.'}</b> ${x.x}<br><br><button class="pri" id="qn">${q<Q.length-1?'Дальше':'Результат'}</button>`;
      $('#qn').onclick=()=>{q++;show()};
    });
  };
  show();
}

draw();
</script>
</body>
</html>
